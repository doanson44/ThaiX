name: Cloudflare Worker Tests

on:
  pull_request:
    branches:
      - master
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker-tests.yml"
  push:
    branches:
      - master
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker tests
        run: node --test cloudflare/_worker.test.mjs
