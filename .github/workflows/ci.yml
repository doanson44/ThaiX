name: ThaiX CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/*'
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
      - develop

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_PATH: 'ThaiX.slnx'
  PRESENTATION_PROJECT: 'src/ThaiX.Presentation/ThaiX.Presentation.csproj'
  UNIT_TEST_PROJECT: 'tests/ThaiX.Application.UnitTests/ThaiX.Application.UnitTests.csproj'
  INTEGRATION_TEST_PROJECT: 'tests/ThaiX.Presentation.IntegrationTests/ThaiX.Presentation.IntegrationTests.csproj'
  COVERAGE_THRESHOLD: 10
  PUBLISH_RUNTIME: 'win-x86'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore NuGet packages
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run unit tests
        run: >
          dotnet test "${{ env.UNIT_TEST_PROJECT }}"
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage"
          --logger "trx;LogFileName=unit-tests.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.SkipAutoProps=true
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[ThaiX.Application]*,[ThaiX.Domain]*"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*.Tests]*,[*.IntegrationTests]*"

      - name: Run integration tests
        run: >
          dotnet test "${{ env.INTEGRATION_TEST_PROJECT }}"
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --results-directory "${{ runner.temp }}/integration-tests"
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Automated Tests
          path: '${{ runner.temp }}/coverage/**/*.trx,${{ runner.temp }}/integration-tests/**/*.trx'
          reporter: dotnet-trx

      - name: Enforce coverage threshold
        if: success() || failure()
        run: |
          echo "Checking code coverage threshold (${COVERAGE_THRESHOLD}%)..."

          COVERAGE_FILE=$(find "${{ runner.temp }}/coverage" -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "::error::Coverage report not found"
            exit 1
          fi

          LINE_RATE=$(grep -oP 'line-rate="\\K[^"]+' "$COVERAGE_FILE" | head -1)
          COVERAGE=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
          echo "Line coverage: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Code coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

          echo "Coverage gate passed: ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage
          retention-days: 7

  package:
    name: Package x86 ZIP
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore NuGet packages
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Restore libman client libraries
        working-directory: src/ThaiX.Client
        run: |
          dotnet tool restore
          dotnet libman restore

      - name: Publish Presentation (${{ env.PUBLISH_RUNTIME }})
        run: >
          dotnet publish "${{ env.PRESENTATION_PROJECT }}"
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --runtime ${{ env.PUBLISH_RUNTIME }}
          --self-contained true
          --output "${{ github.workspace }}/publish-output"

      - name: Create ZIP package
        working-directory: ${{ github.workspace }}/publish-output
        run: zip -r "${{ github.workspace }}/thaix-presentation-win-x86-${{ github.run_number }}.zip" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: thaix-presentation-win-x86-${{ github.run_number }}
          path: ${{ github.workspace }}/thaix-presentation-win-x86-${{ github.run_number }}.zip
          retention-days: 30
