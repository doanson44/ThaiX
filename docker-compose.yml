services:
  # ThaiX API
  thaix-api:
    build:
      context: .
      dockerfile: src/ThaiX.Presentation/Dockerfile
    image: thaix-api:${TAG:-latest}
    container_name: thaix-api
    ports:
      - "${API_PORT:-5005}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=thaix_db;User=root;Password=${DB_PASSWORD:-Abc12345};CharSet=utf8mb4;"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-LOCAL_DEVELOPMENT_SECRET_KEY_32_CHARS_MINIMUM}"
      AllowedOrigins__0: "${CLIENT_BASE_URL:-http://localhost:5005}"
      ClientBaseUrl: "${CLIENT_BASE_URL:-http://localhost:5005}"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./logs:/app/Logs
    restart: unless-stopped
    networks:
      - thaix-network

  # MariaDB
  mariadb:
    image: mariadb:11.4
    container_name: thaix-mariadb
    hostname: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:-Abc12345}"
      MARIADB_DATABASE: thaix_db
      MARIADB_USER: thaix_user
      MARIADB_PASSWORD: "${DB_PASSWORD:-Abc12345}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - thaix-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p${DB_PASSWORD:-Abc12345} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mariadb-data:
    driver: local

networks:
  thaix-network:
    driver: bridge
